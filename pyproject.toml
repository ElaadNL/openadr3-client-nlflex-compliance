[project]
name = "openadr3-client-nlflex-compliance"
dynamic = ["version"]
description = "OpenADR DER profile specification compliance validation plugin for the OpenADR3 client."
authors = []
requires-python = ">=3.12, <4"
readme = "README.md"
license = "Apache-2.0"
dependencies = [
    "pydantic>=2.13.4,<3.0.0",
    "openadr3-client (>=2.2.0,<3.0.0)",
]

[project.urls]
Homepage = "https://github.com/ElaadNL/openadr3-client"
Repository = "https://github.com/ElaadNL/openadr3-client"
"Bug Tracker" = "https://github.com/ElaadNL/openadr3-client/issues"
Changelog = "https://github.com/ElaadNL/openadr3-client/releases"


[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=2.1.0,<3",
    "ruff>=0.15.17,<0.16",
    "pytest>=9.1.0,<10",
    "pytest-cov>=6.1.1,<8",
    "taskipy>=1.14.1,<2",
    "reuse>=6.2.0",
    "pre-commit>=4.6.0",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.sdist]
include = ["openadr3_client_nlflex_compliance"]

[tool.hatch.build.targets.wheel]
include = ["openadr3_client_nlflex_compliance"]

[[tool.mypy.overrides]]
module = ["openadr3_client"]
ignore_missing_imports = true

[tool.taskipy.tasks]
local-ci = "task check && task format && task mypy && task test && task reuse"
fix = "task check-fix && task format-fix && task mypy"
check = "ruff check ."
check-fix = "ruff check --fix ."
check-ci = "ruff check --output-format=github --no-cache ."
mypy = "mypy . --check-untyped-defs"
format = "ruff format . --diff"
format-fix = "ruff format ."
format-ci = "ruff format --diff --no-cache ."
# Will only add headers to files that are not already licensed.
# Cannot ignore uv.lock through REUSE.toml, see https://codeberg.org/fsfe/reuse-tool/pulls/1303
reuse-fix = """
reuse annotate \
  --license Apache-2.0 \
  --copyright "Contributors to openadr3-client-nlflex-compliance <https://github.com/ElaadNL/openadr3-client-nlflex-compliance>" \
  --exclude-year \
  --recursive \
  --skip-unrecognised \
  --skip-existing \
  .
"""
reuse = "reuse lint"
test = "pytest --cov --doctest-modules openadr3_client_nlflex_compliance/ tests/"


[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["ALL"]

# Do not require docstrings for functions, methods and classes
ignore = [
    # From:https://github.com/wemake-services/wemake-django-template/blob/master/pyproject.toml
    "A005",   # allow to shadow stdlib and builtin module names
    "COM812", # trailing comma, conflicts with `ruff format`
    # Different doc rules that we don't really care about:
    "D100",
    "D104",
    "D106",
    "D203",
    "D212",
    "D401",
    "D404",
    "D405",
    "ISC001",  # implicit string concat conflicts with `ruff format`
    "ISC003",  # prefer explicit string concat over implicit concat
    "PLR09",   # we have our own complexity rules
    "PLR6301", # do not require classmethod / staticmethod when self not used
    "TRY003",  # long exception messages from `tryceratops`
    # Start of own error codes
    "ANN002", # Ignore unused *args
    "ANN003", # Ignore unused **kwargs
    "D107", # Allow undocumented __init__
    "TC001", # Move to type checking block (does not play nice with pydantic models)
    "TC002", # Move to type checking block (does not play nice with pydantic models)
]

# Ignores S101 ("Use of 'assert' detected") for the tests.
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ANN201", "SLF001", "S106", "S105", "S311", "PLR2004", "PT018", "FBT003"]

# Pyright, Pylance and basedpyright all read this block, so an editor agrees with CI rather than
# reporting diagnostics the project has already decided against.
#
# This is `[tool.basedpyright]`, not `[tool.pyright]`, and that is not a style choice: basedpyright
# refuses to start if both sections are present ("Pyproject file cannot have both `pyright` and
# `basedpyright` sections. pick one"), and when that happens it does not fail the run - it silently
# falls back to running with no project configuration at all, which is worse than picking wrong.
# Plain pyright, in turn, does not recognise `[tool.basedpyright]` and simply ignores the whole
# table, which is fine here: every rule below is one that basedpyright enables by default and
# pyright does not, so pyright's own defaults already agree with us without reading any of this.
[tool.basedpyright]

# Long validation messages are split across lines to stay inside the 120 column limit, which is
# what `ruff format` produces. The ruff ISC001 and ISC003 ignores above record the same decision;
# without this, an editor with reportImplicitStringConcatenation enabled flags every one of them.
reportImplicitStringConcatenation = false

# openadr3-client ships py.typed but leaves its generics - Attribute, ValuesMap, Interval and
# friends - unparameterised. Importing and using any of its models therefore gives basedpyright a
# type it cannot resolve to a parameterised generic. That is a property of the dependency, not of
# our code, and annotating around it here would mean inventing type arguments the library does not
# itself commit to, so the five rules below are disabled project-wide rather than suppressed
# call-by-call.
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownParameterType = false
reportMissingTypeArgument = false

# plugin.register_model_validator(...) returns the plugin for chaining and
# ValidatorPluginRegistry.clear_plugins() returns the registry; call sites that construct an object
# solely to trigger its validators (most of the test suite) or call clear_plugins() as a fixture
# teardown intentionally discard that return value. Ignoring it is the intended usage, not an
# oversight.
reportUnusedCallResult = false

# The `_UNSET: Any = object()` sentinel every test builder compares against, and the
# `*_args: Any, **_kwargs: Any` on `setup()` (which must match the base class signature), are
# deliberate uses of Any rather than unannotated code. The same root cause also surfaces as
# reportAny at a couple of call sites where our own validators read `getattr(obj, name, default)`:
# a field declared on only some subtypes of a model (for example `targets` on `NewResourceBlRequest`
# but not on the shared `Resource` base every validator is registered against) has no type
# basedpyright can assign it other than Any.
reportExplicitAny = false
reportAny = false

