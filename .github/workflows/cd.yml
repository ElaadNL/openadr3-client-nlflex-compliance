# This workflow will upload a Python Package to PyPI when a release is created,
# or a pre-release (e.g. 0.3.0rc1) when run manually through workflow_dispatch.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python#publishing-to-package-registries

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Upload Python Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      base_version:
        description: "Target final version, e.g. 0.3.0"
        required: true
      stage:
        description: "Pre-release stage (alpha, beta or release candidate)"
        type: choice
        options: [a, b, rc]
        default: rc

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Set up Python"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.22"
          enable-cache: false

      # Pre-releases are not tagged, so override the VCS-derived version with
      # the next free <base_version><stage>N on PyPI.
      - name: Determine pre-release version
        if: github.event_name == 'workflow_dispatch'
        env:
          BASE: ${{ inputs.base_version }}
          STAGE: ${{ inputs.stage }}
        run: |
          if ! [[ "$BASE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::base_version must look like 1.2.3, got '$BASE'"
            exit 1
          fi
          last=$(curl -fsSL https://pypi.org/pypi/openadr3-client-nlflex-compliance/json \
            | jq -r '.releases | keys[]' \
            | { grep -E "^${BASE//./\\.}${STAGE}[0-9]+$" || true; } \
            | sed -E "s/.*${STAGE}//" | sort -n | tail -1)
          version="${BASE}${STAGE}$(( ${last:-0} + 1 ))"
          echo "SETUPTOOLS_SCM_PRETEND_VERSION=${version}" >> "$GITHUB_ENV"
          echo "Publishing pre-release \`${version}\` from \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          
      - name: Build release distributions
        run: uv build

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    runs-on: ubuntu-latest
    needs:
      - release-build
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write

    # Dedicated environments with protections for publishing are strongly recommended.
    # For more information, see: https://docs.github.com/en/actions/deployment/targeting-different-environments/using-environments-for-deployment#deployment-protection-rules
    environment:
      name: pypi
      # ALTERNATIVE: if your GitHub Release name is the PyPI project version string
      # ALTERNATIVE: exactly, uncomment the following line instead:
      # url: https://pypi.org/project/YOURPROJECT/${{ github.event.release.name }}

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
